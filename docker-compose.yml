services:
  ams-agentes:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./cases:/app/cases
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - CASES_DIR=/app/cases
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
